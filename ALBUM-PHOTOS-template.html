<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Photos - Protégé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Password Protection Overlay */
        #password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.5s ease;
        }

        #password-overlay.hidden {
            display: none;
        }

        .password-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-container h2 {
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .password-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .password-input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .password-input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .password-input-group input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        .password-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .password-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }

        .password-submit:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            animation: shake 0.5s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Gallery Content */
        #gallery-content {
            display: none;
            width: 100%;
            height: 100vh;
        }

        #gallery-content.visible {
            display: block;
        }

        .container {
            max-width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            color: #764ba2;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 600;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Fullscreen Carousel */
        .carousel {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .carousel-inner {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-item {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .carousel-item img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Navigation Arrows */
        .carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-control:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-control.prev {
            left: 30px;
        }

        .carousel-control.next {
            right: 30px;
        }

        /* Image Counter */
        .image-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        /* Thumbnail Navigation */
        .thumbnail-nav {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            max-width: 90%;
            overflow-x: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .thumbnail-nav::-webkit-scrollbar {
            height: 5px;
        }

        .thumbnail-nav::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .thumbnail-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            flex-shrink: 0;
        }

        .thumbnail:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .thumbnail.active {
            border-color: white;
            transform: scale(1.15);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Loading Animation */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .carousel-control {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .carousel-control.prev {
                left: 15px;
            }

            .carousel-control.next {
                right: 15px;
            }

            .thumbnail {
                width: 60px;
                height: 60px;
            }

            .back-button {
                padding: 10px 18px;
                font-size: 14px;
            }

            .image-counter {
                font-size: 14px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Password Protection Overlay -->
    <div id="password-overlay">
        <div class="password-container">
            <h2>🔒 Album Protégé</h2>
            <p>Veuillez entrer le mot de passe pour accéder aux photos</p>
            <div class="password-input-group">
                <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="off">
            </div>
            <button class="password-submit" onclick="checkPassword()">Accéder</button>
            <p class="error-message" id="error-message">❌ Mot de passe incorrect</p>
        </div>
    </div>

    <!-- Gallery Content -->
    <div id="gallery-content">
        <div class="container">
            <a class="back-button" href="photos.html">← Retour</a>
            
            <!-- Fullscreen Carousel -->
            <div class="carousel">
                <div class="carousel-inner" id="carousel-inner">
                {{CAROUSEL_ITEMS}}
                </div>

                <!-- Navigation Controls -->
                <button class="carousel-control prev" onclick="prevSlide()">‹</button>
                <button class="carousel-control next" onclick="nextSlide()">›</button>
            </div>

            <!-- Image Counter -->
            <div class="image-counter" id="image-counter">1 / {{TOTAL_PHOTOS}}</div>

            <!-- Thumbnail Navigation -->
            <div class="thumbnail-nav" id="thumbnail-nav">
            {{THUMBNAILS}}
            </div>
        </div>
    </div>

    <script>
        // Password Protection
        const correctPassword = "AB";
        const passwordOverlay = document.getElementById('password-overlay');
        const galleryContent = document.getElementById('gallery-content');
        const passwordInput = document.getElementById('password-input');
        const errorMessage = document.getElementById('error-message');

        // Check if user has already entered correct password (session storage)
        if (sessionStorage.getItem('albumAccess') === 'granted') {
            showGallery();
        }

        // Allow Enter key to submit password
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function checkPassword() {
            const enteredPassword = passwordInput.value;
            
            if (enteredPassword === correctPassword) {
                sessionStorage.setItem('albumAccess', 'granted');
                showGallery();
            } else {
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
                
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        }

        function showGallery() {
            passwordOverlay.classList.add('hidden');
            galleryContent.classList.add('visible');
        }

        // Carousel Functionality
        let currentSlide = 0;
        const carouselInner = document.getElementById('carousel-inner');
        const slides = document.querySelectorAll('.carousel-item');
        const thumbnails = document.querySelectorAll('.thumbnail');
        const imageCounter = document.getElementById('image-counter');
        const totalSlides = {{TOTAL_PHOTOS}};

        function updateCarousel() {
            carouselInner.style.transform = `translateX(-${currentSlide * 100}%)`;
            imageCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;
            
            // Update active thumbnail
            thumbnails.forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentSlide);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!galleryContent.classList.contains('visible')) return;
            
            if (e.key === 'ArrowRight') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'Escape') {
                window.location.href = 'photos.html';
            }
        });

        // Touch/Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;

        carouselInner.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        carouselInner.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchStartX - touchEndX > 50) {
                nextSlide();
            }
            if (touchEndX - touchStartX > 50) {
                prevSlide();
            }
        }

        // Auto-advance carousel (optional - commented out)
        // setInterval(nextSlide, 5000);
    </script>
</body>
</html>
</body>
</html>
