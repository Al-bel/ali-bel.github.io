<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islande - Souvenirs de voyage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; overflow: hidden; }
        #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #password-overlay.hidden { display: none; }
        .password-container { background: rgba(255, 255, 255, 0.95); padding: 50px 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); text-align: center; max-width: 400px; width: 90%; }
        .password-container h2 { color: #764ba2; margin-bottom: 10px; font-size: 2em; }
        .password-input-group input { width: 100%; padding: 15px 20px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        .password-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        #gallery-content { display: none; width: 100%; height: 100vh; }
        #gallery-content.visible { display: block; }
        .back-button { position: fixed; top: 20px; left: 20px; padding: 12px 24px; background: rgba(255, 255, 255, 0.95); color: #764ba2; text-decoration: none; border-radius: 10px; z-index: 100; }
        .carousel { position: relative; width: 100%; height: 100vh; overflow: hidden; background: #000; }
        .carousel-inner { position: relative; width: 100%; height: 100%; display: flex; transition: transform 0.6s ease; }
        .carousel-item { min-width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .carousel-item img, .carousel-item video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .carousel-control { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.15); color: white; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 28px; cursor: pointer; z-index: 10; }
        .carousel-control.prev { left: 30px; }
        .carousel-control.next { right: 30px; }
        .image-counter { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.15); color: white; padding: 12px 24px; border-radius: 25px; z-index: 10; }
        .thumbnail-nav { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; max-width: 90%; overflow-x: auto; padding: 10px; background: rgba(0, 0, 0, 0.3); border-radius: 15px; }
        .thumbnail { width: 80px; height: 80px; border-radius: 10px; overflow: hidden; cursor: pointer; border: 3px solid transparent; flex-shrink: 0; }
        .thumbnail.active { border-color: white; }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="password-overlay">
        <div class="password-container">
            <h2>🔒 🇮🇸 Islande</h2>
            <p>Veuillez entrer le mot de passe pour accéder aux souvenirs</p>
            <div class="password-input-group"><input type="password" id="password-input" placeholder="Mot de passe"></div>
            <button class="password-submit" onclick="checkPassword()">Accéder</button>
        </div>
    </div>
    <div id="gallery-content">
        <div class="container">
            <a class="back-button" href="../voyages.html">← Retour</a>
            <div class="carousel">
                <div class="carousel-inner" id="carousel-inner"></div>
                <button class="carousel-control prev" onclick="prevSlide()">‹</button>
                <button class="carousel-control next" onclick="nextSlide()">›</button>
            </div>
            <div class="image-counter" id="image-counter"></div>
            <div class="thumbnail-nav" id="thumbnail-nav"></div>
        </div>
    </div>
    <script>
        const correctPassword = "islande";
        // Liste de vos photos dans VOYAGES/ISLANDE/
        const imageFiles = ["10.jpg.JPG", "1.JPEG.webp", "2.JPEG.webp", "3.JPEG.webp", "4.JPEG.webp", "5.JPEG.webp", "6.JPEG.webp"];
        
        function checkPassword() {
            if (document.getElementById('password-input').value.toLowerCase() === correctPassword) {
                document.getElementById('password-overlay').classList.add('hidden');
                document.getElementById('gallery-content').classList.add('visible');
                loadGallery();
            } else {
                alert("Mot de passe incorrect");
            }
        }

        let currentSlide = 0;
        function loadGallery() {
            const inner = document.getElementById('carousel-inner');
            const nav = document.getElementById('thumbnail-nav');
            imageFiles.forEach((name, i) => {
                const item = document.createElement('div');
                item.className = 'carousel-item';
                if (name.endsWith('.mp4')) {
                    const v = document.createElement('video'); 
                    v.src = '../VOYAGES/ISLANDE/' + name; 
                    v.controls = true; 
                    item.appendChild(v);
                } else {
                    const img = document.createElement('img'); 
                    img.src = '../VOYAGES/ISLANDE/' + name; 
                    item.appendChild(img);
                }
                inner.appendChild(item);
                
                const thumb = document.createElement('div');
                thumb.className = i === 0 ? 'thumbnail active' : 'thumbnail';
                thumb.onclick = () => goToSlide(i);
                const tImg = document.createElement('img'); 
                // Pour les vidéos, on peut mettre une icône ou laisser vide
                tImg.src = name.endsWith('.mp4') ? '' : '../VOYAGES/ISLANDE/' + name; 
                thumb.appendChild(tImg);
                nav.appendChild(thumb);
            });
            updateCarousel();
        }

        function updateCarousel() {
            document.getElementById('carousel-inner').style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
            document.getElementById('image-counter').textContent = (currentSlide + 1) + ' / ' + imageFiles.length;
            document.querySelectorAll('.thumbnail').forEach((t, i) => t.classList.toggle('active', i === currentSlide));
        }
        function nextSlide() { currentSlide = (currentSlide + 1) % imageFiles.length; updateCarousel(); }
        function prevSlide() { currentSlide = (currentSlide - 1 + imageFiles.length) % imageFiles.length; updateCarousel(); }
        function goToSlide(i) { currentSlide = i; updateCarousel(); }
        
        // Permettre de valider avec la touche Entrée
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
